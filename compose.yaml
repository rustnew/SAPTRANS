services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://saptrans:${POSTGRES_PASSWORD}@db:5432/saptrans
      LISTEN_ADDR: 0.0.0.0:3000
      RUST_LOG: info
      SAPTRANS_SESSION_KEY_HEX: ${SAPTRANS_SESSION_KEY_HEX}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saptrans
      POSTGRES_USER: saptrans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saptrans"]
      interval: 5s
      timeout: 5s
      retries: 10
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
